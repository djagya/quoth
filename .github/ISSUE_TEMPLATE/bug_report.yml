name: Bug report
description: Something in quoth doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please don't paste private notes, chat history or snapshot
        contents here: reproduce with the synthetic fixture in `eval/public/` if you can.
        Security problems go through private reporting, not issues (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: quoth version
      description: Output of `uv run python -c "import importlib.metadata as m; print(m.version('quoth'))"`.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: The exact error text or traceback, with private data removed.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, and whether you use BGE-M3 or the hash-ngram embedder.
