[project]
name = "quoth"
version = "0.17.1"
description = "Local evidence memory for a personal AI assistant: immutable vault snapshots, a reviewed core-memory ledger, and a Hermes provider"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp>=2.2,<3", "numpy>=2"]

[project.optional-dependencies]
dense = ["onnxruntime>=1.20", "tokenizers>=0.20"]

[project.scripts]
quoth = "quoth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quoth"]

[tool.hatch.build.targets.wheel.force-include]
"eval" = "quoth/_eval"
"hermes_plugin/quoth" = "quoth/_hermes_plugin/quoth"
"web/control-surface" = "quoth/_webui_extension"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
